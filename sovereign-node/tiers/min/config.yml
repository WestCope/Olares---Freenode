---
# SovereignNode Tier 1 (MIN) Configuration
tier: min
version: "0.1.0"

node:
  hostname: "sovereign-node-min"
  timezone: "UTC"
  locale: "en_US.UTF-8"

storage:
  data_path: "/opt/sovereign-node/data"
  backup_path: "/opt/sovereign-node/backups"

services:
  nextcloud:
    enabled: true
    port: 8443
    data_volume: "${STORAGE_DATA_PATH}/nextcloud"
    max_upload_size: "16G"

  jellyfin:
    enabled: true
    port: 8096
    media_volume: "${STORAGE_DATA_PATH}/media"
    hardware_transcode: false  # Enable on devices with iGPU

  home_assistant:
    enabled: true
    port: 8123
    config_volume: "${STORAGE_DATA_PATH}/homeassistant"

  matrix_synapse:
    enabled: true
    port: 8448
    server_name: "${NODE_HOSTNAME}.local"
    data_volume: "${STORAGE_DATA_PATH}/matrix"

  bitwarden:
    enabled: true
    port: 8080
    data_volume: "${STORAGE_DATA_PATH}/bitwarden"

  ollama:
    enabled: true
    port: 11434
    models:
      - "phi3:mini"       # 2.3 GB, good for Tier 1
      - "llama3.2:3b"     # 2.0 GB, great general model
    gpu_enabled: false

depins:
  grass:
    enabled: true
    # Set GRASS_USERNAME and GRASS_PASSWORD in .env
    auto_start: true

  mysterium:
    enabled: true
    # Set MYSTERIUM_WALLET in .env
    payout_network: "polygon"
    auto_start: true

  uprock:
    enabled: false  # Enable after account creation
    auto_start: true

mesh:
  nebula:
    enabled: true
    # Nebula config generated by: scripts/install/generate-nebula-config.sh
    config_path: "${STORAGE_DATA_PATH}/nebula/config.yml"
    cert_path: "${STORAGE_DATA_PATH}/nebula/certs"

  netbird:
    enabled: false  # Alternative to Nebula - enable one or the other

backup:
  restic:
    enabled: true
    schedule: "0 2 * * *"  # Daily at 2 AM
    retention:
      daily: 7
      weekly: 4
      monthly: 6
    # Configure backup destination in .env:
    # RESTIC_REPOSITORY=s3:s3.amazonaws.com/my-bucket
    # RESTIC_PASSWORD=<strong-password>
    # AWS_ACCESS_KEY_ID=...
    # AWS_SECRET_ACCESS_KEY=...

monitoring:
  enabled: true
  port: 3000  # Grafana dashboard
  metrics_retention: "7d"

sov_token:
  enabled: true
  wallet_path: "${STORAGE_DATA_PATH}/wallet/keypair.json"
  rpc_url: "https://api.mainnet-beta.solana.com"
  auto_earn: true  # Automatically receive SOV for DePIN contributions
