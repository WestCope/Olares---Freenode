[package]
name = "sov-token"
version = "0.1.0"
description = "SOV Token — SovereignNode network utility token on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sov_token"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token"] }

[dev-dependencies]
anchor-client = "0.30.1"
