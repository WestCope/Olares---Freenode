version: "3.9"
# SovereignNode — Yggdrasil IPv6 Overlay Network
# End-to-end encrypted IPv6 mesh network
# Reference: https://github.com/yggdrasil-network/yggdrasil-go

services:
  yggdrasil:
    image: ghcr.io/yggdrasil-network/yggdrasil-go:latest
    container_name: sn-yggdrasil
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "9001:9001/tcp"    # Peering port
    volumes:
      - ./yggdrasil.conf:/etc/yggdrasil.conf:ro
    network_mode: host
    command: ["-useconffile", "/etc/yggdrasil.conf", "-logto", "stdout"]
